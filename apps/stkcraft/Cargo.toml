[package]
name = "stkcraft"
description = "STKCraft: space mission analysis and visualisation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
stkcraft-framework-core.workspace = true
stkcraft-framework-time.workspace = true
stkcraft-astro-frames.workspace = true
stkcraft-astro-sgp4.workspace = true
stkcraft-astro-access.workspace = true
stkcraft-astro-engine.workspace = true
stkcraft-framework-extensions.workspace = true
stkcraft-ui-viewport.workspace = true
# The agent interface: `stkcraft mcp` serves the command registry over stdio.
stkcraft-agent-mcp.workspace = true
# The control channel a launcher or a sibling app drives this session through.
stkcraft-agent-control.workspace = true
# The interface strings and their catalogs. The catalogs are an optional build input: without any,
# every lookup shows English.
stkcraft-framework-i18n.workspace = true
stkcraft-agent-knowledge.workspace = true
# One crate owns persistence: the record, the cache and the vector store.
stkcraft-framework-storage.workspace = true
# The family's shared UI library: the interface font stack (installed system fonts included, which
# is what makes a CJK interface render), theme tokens and the widgets the Craft apps share.
craft-ui.workspace = true
# `stkcraft ask` puts a model in front of the same tools an MCP client sees.
stkcraft-agent-runtime.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

# The window. `default-features = false` plus explicit features because the default set pulls in
# backends this app never uses (accesskit, glow) and every one of them has to be reviewed for
# licensing and for wasm hostility before it may ship.
eframe = { workspace = true }
egui = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }

[build-dependencies]
# The build script extracts the interface strings with the same scanner `cargo xtask i18n` uses, so
# a window that translates itself and a translator's catalog describe the same interface.
stkcraft-framework-i18n.workspace = true
stkcraft-agent-knowledge.workspace = true
# One crate owns persistence: the record, the cache and the vector store.
stkcraft-framework-storage.workspace = true
# The family's shared UI library: the interface font stack (installed system fonts included, which
# is what makes a CJK interface render), theme tokens and the widgets the Craft apps share.
craft-ui.workspace = true

[lints]
workspace = true
