name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run. Every push to the default branch gets its
# own run, so each state of the default branch is checked to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # `fonts-noto-cjk` is not a build dependency: it is the face the `zh` catalog needs.
      # `apps/stkcraft/src/fonts.rs` asserts that every shipped catalog can be drawn by the stack
      # the app installs — installed fonts included, which is how a CJK interface renders at all —
      # and a bare runner has no CJK font, so the assertion was red on every run from 0.1.30 to
      # 0.1.40. Installing the font makes the check mean what it says instead of weakening it.
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        fonts-noto-cjk

  # The OCR path against a real engine. `craft-pdf` keeps a C library out of the crate graph and the engine
  # is configuration, so this job is how "the command really reads a scan" is verified rather than assumed.
  # It runs the `#[ignore]`d test in `crates/agent/knowledge/tests/ocr_real.rs`, which needs the tools
  # installed here and nothing else.
  ocr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the OCR stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng poppler-utils imagemagick img2pdf fonts-dejavu-core
      - name: OCR a scanned page with a real engine
        run: cargo test -p stkcraft-agent-knowledge --test ocr_real -- --ignored --nocapture
