[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/time",
    "crates/body",
    "crates/ephemeris",
    "crates/frames",
    "crates/sgp4",
    "crates/access",
    "crates/engine",
    "crates/viewport",
    "apps/stkcraft",
    "xtask",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spacelibres/STKCraft"
authors = ["ArtCraft Team and the STKCraft contributors"]

[workspace.dependencies]
# Internal crates. Sibling crates reference each other by path and inherit the single
# workspace version, so a version bump is one edit in `[workspace.package]`.
stkcraft-core = { path = "crates/core", version = "0.1.5" }
stkcraft-time = { path = "crates/time", version = "0.1.5" }
stkcraft-body = { path = "crates/body", version = "0.1.5" }
stkcraft-ephemeris = { path = "crates/ephemeris", version = "0.1.5" }
stkcraft-frames = { path = "crates/frames", version = "0.1.5" }
stkcraft-sgp4 = { path = "crates/sgp4", version = "0.1.5" }
stkcraft-access = { path = "crates/access", version = "0.1.5" }
stkcraft-engine = { path = "crates/engine", version = "0.1.5" }
stkcraft-viewport = { path = "crates/viewport", version = "0.1.5" }

# Third-party. Time goes through `chrono` per the suite standard: never hand-roll
# UTC/calendar conversion.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# The user interface. `eframe` owns the window and the egui context; the viewport draws
# through the `wgpu` version that `eframe` itself links, so the two cannot drift apart.
# Versions are pinned by hand rather than by a caret range because a wgpu major bump
# changes the pipeline descriptors and the WGSL entry-point surface.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
# The viewport draws inside `egui`'s own render pass, which is what `egui-wgpu` paint callbacks
# are for. Pinned alongside `egui` because the two share the `wgpu` types in their signatures.
egui-wgpu = "0.37"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The suite-wide "never crash" contract: these are denied in every production crate.
# A crate root also repeats them with `#![deny(...)]` so they hold even if a manifest
# forgets `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Web builds stay small.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
