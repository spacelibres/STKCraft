[workspace]
resolver = "3"
members = [
    # The platform: nothing here knows what an orbit is.
    "crates/framework/core",
    "crates/framework/time",
    "crates/framework/i18n",
    "crates/framework/extensions",
    "crates/framework/storage",
    # The orbital-analysis domain: the astronomy lives here and nowhere else.
    "crates/astro/body",
    "crates/astro/frames",
    "crates/astro/ephemeris",
    "crates/astro/sgp4",
    "crates/astro/access",
    "crates/astro/engine",
    # The model-facing surface: what an agent or an MCP client drives.
    "crates/agent/control",
    "crates/agent/knowledge",
    "crates/agent/mcp",
    "crates/agent/runtime",
    # Presentation.
    "crates/ui/viewport",
    "apps/stkcraft",
    "xtask",
]

[workspace.package]
version = "0.1.108"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/spacelibres/STKCraft"
homepage = "https://www.stkcraft.com"
authors = ["ArtCraft Team and the STKCraft contributors"]

[workspace.dependencies]
# Internal crates. Sibling crates reference each other by path and inherit the single
# workspace version, so a version bump is one edit in `[workspace.package]`.
stkcraft-framework-core = { path = "crates/framework/core", version = "0.1.108" }
stkcraft-framework-time = { path = "crates/framework/time", version = "0.1.108" }
stkcraft-astro-body = { path = "crates/astro/body", version = "0.1.108" }
stkcraft-astro-ephemeris = { path = "crates/astro/ephemeris", version = "0.1.108" }
stkcraft-framework-extensions = { path = "crates/framework/extensions", version = "0.1.108" }
stkcraft-framework-storage = { path = "crates/framework/storage", version = "0.1.108" }
stkcraft-astro-frames = { path = "crates/astro/frames", version = "0.1.108" }
stkcraft-framework-i18n = { path = "crates/framework/i18n", version = "0.1.108" }
stkcraft-agent-control = { path = "crates/agent/control", version = "0.1.108" }
stkcraft-agent-knowledge = { path = "crates/agent/knowledge", version = "0.1.108" }
stkcraft-astro-sgp4 = { path = "crates/astro/sgp4", version = "0.1.108" }
stkcraft-astro-access = { path = "crates/astro/access", version = "0.1.108" }
stkcraft-astro-engine = { path = "crates/astro/engine", version = "0.1.108" }
stkcraft-agent-mcp = { path = "crates/agent/mcp", version = "0.1.108" }
stkcraft-agent-runtime = { path = "crates/agent/runtime", version = "0.1.108" }
stkcraft-ui-viewport = { path = "crates/ui/viewport", version = "0.1.108" }

# PDF reading, from the family's shared reader: the same `craft-pdf` the siblings use, over the
# same patched reader backends, so a paper parses here exactly as it does in `pdfcraft`. Only the
# reader and the interpreter are enabled — this app extracts text and never draws a page — which
# keeps the rasteriser, and with it `wgpu`, out of the knowledge crate.
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0", default-features = false, features = ["interpret"] }
# The geometry types the PDF interpreter's device trait speaks in. Named directly because a device
# signature contains them, and the version has to be the one `hayro-interpret` was built against or
# the trait does not match.
kurbo = "0.13"

# Third-party. Time goes through `chrono` per the suite standard: never hand-roll
# UTC/calendar conversion.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite for the record, and SHA-256 for the digests that make a stored row reproducible.
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.11"
thiserror = "2"
log = "0.4"
# The window icon is the project's albatross mark, embedded as a PNG and decoded with bounds. The
# PNG is the family's own artwork, not a general image pipeline: one decoder, one 512 × 512 file.
png = "0.18"
# Operating-system entropy for the control-channel token: BCryptGenRandom on Windows, getrandom(2)
# on Linux, the platform API on macOS. It replaces a `/dev/urandom` read that had to be bounded by
# hand and a pid-plus-clock fallback that was not entropy on Windows.
getrandom = "0.3"

# The user interface. `eframe` owns the window and the egui context; the viewport draws
# through the `wgpu` version that `eframe` itself links, so the two cannot drift apart.
# Versions are pinned by hand rather than by a caret range because a wgpu major bump
# changes the pipeline descriptors and the WGSL entry-point surface.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
# The ArtCraft family's shared UI library: the font stack every Craft app installs (including
# installed system fonts, which is how a CJK interface renders at all), the theme tokens, and the
# widgets the siblings share. One craft-libs revision for every craft-* crate, as the family does.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", features = ["system_fonts"] }
# The viewport draws inside `egui`'s own render pass, which is what `egui-wgpu` paint callbacks
# are for. Pinned alongside `egui` because the two share the `wgpu` types in their signatures.
egui-wgpu = "0.37"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The suite-wide "never crash" contract: these are denied in every production crate.
# A crate root also repeats them with `#![deny(...)]` so they hold even if a manifest
# forgets `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"

[profile.dev]
# Keep file and line information for backtraces, but not the full variable/type debug info: on
# Windows that produced multi-gigabyte PDBs, and the shared gate already sets
# CARGO_PROFILE_DEV_DEBUG=line-tables-only. A local `cargo xtask ci` should not build a different
# profile from the one CI checks.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Web builds stay small.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# The ArtCraft family's reviewed egui stack. Every Craft app builds against the same fork revision,
# so a widget behaves the same in all of them and a fix lands once; `craft-ui`'s font stack and the
# docking widgets depend on the fork's additions. The revisions are pinned to the one the family's
# `craft-ai-integrations`/`craft-libs` documents; bumping them is a review, not a caret range.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# The family's patched PDF reader backends, at the same `craft-libs` revision as `craft-ui`.
# `craft-pdf` calls methods these forks add — the interpreter device's `actual_text`, the bounded
# `Pdf::new_with_password_and_limits` — so an unpatched `hayro` from crates.io does not compile
# against it. Cargo ignores dependency-local patches: these have to live in the consumer's root
# manifest, which is why `craft-pdf`'s README states them as the consumer's obligation.
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.7.2" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.7.0" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.3.0" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0" }
