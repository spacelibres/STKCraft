[package]
name = "stkcraft-agent-knowledge"
description = "The user's own documents, searched before the model answers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The derived index is cached in the key-value store (docs/design/storage.md).
stkcraft-framework-storage.workspace = true
# Papers arrive as PDFs, and the family's shared reader is what opens them: the same crate, and the
# same patched backends, that `pdfcraft` and the other Craft apps read with.
craft-pdf.workspace = true
# The interpreter's `Device` trait takes `kurbo` geometry, so the device has to name those types.
kurbo.workspace = true
# Expert packages and their formula records are authored TOML; the validator reads them before any
# expert can cite one.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "0.8"

[lints]
workspace = true
