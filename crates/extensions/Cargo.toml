[package]
name = "stkcraft-extensions"
description = "The extension package contract: manifests, ids and trust tiers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
# The manifest is TOML, as every Rust project's is, and the `toml` crate is already in `xtask`.
toml = "0.8"

[features]
# Third-party packages are designed in and switched off. No release build enables this, and the
# test in `src/lib.rs` fails if it ever becomes a default: opening the path is a decision, not a
# side effect of a build.
third-party = []

[lints]
workspace = true
